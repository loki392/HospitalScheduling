<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login - MediSchedule</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fb;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px 60px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 420px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #123b66;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b5ed7;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0b5ed7;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #084298;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background: #d1e7dd;
            color: #0f5132;
            border-radius: 8px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #0b5ed7;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background: #123b66;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🏥 MediSchedule</div>
</header>

<div class="container">

    <div class="login-box">

        <h1>Patient Login</h1>

        <p class="subtitle">
            Login to manage your hospital appointments
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div id="loginMessage" class="message">
                Login successful!
            </div>

        </form>

        <div class="register-link">
            New patient?
            <a href="register.html">Create an account</a>
        </div>

    </div>

</div>

<footer>
    <p>Priority-Based Hospital Patient Scheduling System</p>
    <p>Minor Project - 2026</p>
</footer>

<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            window.location.href = "dashboard.html";
        });

</script>

</body>
</html>
